<!DOCTYPE html>
<html lang="en" data-page="home">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nicolás Blanco Muzzolon — Senior Salesforce Developer</title>
  <meta name="description" content="Senior Salesforce Developer with 7+ years and 8 certifications. Apex, LWC, integrations and solution architecture.">
  <meta property="og:title" content="Nicolás Blanco Muzzolon — Senior Salesforce Developer">
  <meta property="og:description" content="Senior Salesforce Developer with 7+ years and 8 certifications. Apex, LWC, integrations and solution architecture.">
  <meta name="theme-color" content="#fafaf7">

  <!-- Runs before first paint:
       - ?theme=navy|graphite|oxblood|forest previews an alternative palette
       - arms the motion; on the home page, the first visit of a session also
         hides the hero for the load sequence
       Skipped for reduced motion. The timer is a failsafe if the scripts never run. -->
  <script>
    (function () {
      var root = document.documentElement;
      var theme = /[?&]theme=([a-z]+)/.exec(location.search);
      if (theme) root.setAttribute("data-theme", theme[1]);
      if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      root.classList.add("js-motion");
      if (root.getAttribute("data-page") === "home") {
        var seen = false;
        try { seen = sessionStorage.getItem("intro") === "1"; sessionStorage.setItem("intro", "1"); } catch (e) {}
        if (!seen) root.classList.add("is-loading");
      }
      setTimeout(function () {
        if (root.classList.contains("is-loading")) {
          root.classList.remove("is-loading");
          root.classList.add("is-ready");
        }
        if (!root.classList.contains("motion-on")) root.classList.remove("js-motion");
      }, 7000);
    })();
  </script>

  <!-- Necto Mono by Marco Condello / Collletttivo, SIL OFL (fonts/OFL.txt) -->
  <link rel="preload" href="fonts/necto-mono-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">

  <!-- Motion: GSAP + ScrollTrigger for the scenes. If they fail to load, the page
       stays fully readable without motion. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script src="script/script.js" defer></script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>

  <header class="top">
    <a class="mark fade" href="./" aria-label="Nicolás Blanco Muzzolon, home">nbm</a>
    <nav class="nav fade" style="--d: 200" aria-label="Pages">
      <a href="about/">About</a>
      <a href="projects/">Projects</a>
      <a href="experience/">Experience</a>
      <a href="contact/">Contact</a>
    </nav>
  </header>

  <main>

    <!-- HERO: on the first visit of a session it plays the load sequence. On
         desktop it stays put as the left column while the reel on the right
         moves; on phones it scrolls away. -->
    <section class="hero" aria-label="Introduction">
      <span class="axis" aria-hidden="true"></span>

      <p class="role fade" style="--d: 320">Senior Salesforce Developer — Argentina</p>

      <h1 class="name">
        <span class="row">
          <span class="line" style="--i: 0"><span class="count" aria-hidden="true">0</span><span class="word">Nicolás</span></span>
        </span>
        <span class="row">
          <span class="line" style="--i: 1"><span class="word">Blanco</span></span>
          <span class="line" style="--i: 2"><span class="word">Muzzolon</span></span>
        </span>
      </h1>

      <p class="ghost ghost-l" aria-hidden="true">blanco</p>
      <p class="ghost ghost-r" aria-hidden="true">muzzo</p>
    </section>

    <!-- On desktop the reel is its own scroller: the cards tilt as they leave the
         middle and the reel settles on a card when the wheel stops. -->
    <div class="reel" id="content" data-tilt data-snap>
    <nav class="cards" aria-label="Sections">
      <a class="card" href="about/">
        <span class="card-num" data-fade>01</span>
        <span class="card-title" data-lines>About</span>
        <span class="card-go" aria-hidden="true">→</span>
      </a>
      <a class="card" href="projects/">
        <span class="card-num" data-fade>02</span>
        <span class="card-title" data-lines>Projects</span>
        <span class="card-go" aria-hidden="true">→</span>
      </a>
      <a class="card" href="experience/">
        <span class="card-num" data-fade>03</span>
        <span class="card-title" data-lines>Experience</span>
        <span class="card-go" aria-hidden="true">→</span>
      </a>
      <a class="card" href="contact/">
        <span class="card-num" data-fade>04</span>
        <span class="card-title" data-lines>Contact</span>
        <span class="card-go" aria-hidden="true">→</span>
      </a>
    </nav>

    </div>

    <!-- Fixed to the bottom on desktop, over the content; at the end of the page on phones. -->
    <footer class="foot">
      <p class="foot-note">© <span id="year">2026</span> Nicolás Blanco Muzzolon</p>
      <p class="foot-note foot-note-r">Built by hand in Argentina. Hosted on GitHub Pages.</p>
    </footer>
  </main>
</body>
</html>
